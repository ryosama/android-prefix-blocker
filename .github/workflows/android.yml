name: Android
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint et APK de vérification
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Vérifier les fichiers publics
        run: python3 scripts/check-public-artifacts.py app/build/outputs/apk/debug/app-debug.apk
